<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://restaurant-booking-backend-y3sp.onrender.com;">
    <title>Au Murmure des Flots</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="service-ui.css">
    <link rel="stylesheet" href="staff-tools.css">
</head>
<body>
    <div class="shell">
        <!-- Rail sombre compact -->
        <nav class="rail" aria-label="Navigation principale">
            <img class="rail-logo" src="assets/brand-spiral.svg" alt="Au Murmure des Flots" width="52" height="52">
            <div class="rail-nav">
                <a href="#" data-view="floor-plan" class="rail-item" title="Plan de salle"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="15" width="18" height="6" rx="1"/></svg></span></a>
                <a href="#" data-view="today" class="rail-item active" title="Aujourd'hui"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2v2H9z"/></svg></span></a>
                <a href="#" data-view="pending" class="rail-item" title="À confirmer"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span></a>
                <a href="#" data-view="week" class="rail-item" title="Semaine"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 11h18m-12 0v10m6-10v10"/></svg></span></a>
                <a href="#" data-view="month" class="rail-item" title="Mois"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 11h18m-12 0v10m6-10v10M3 16h18"/></svg></span></a>
                <a href="#" data-view="clients" class="rail-item" title="Clients"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v3"/></svg></span></a>
                <a href="#" data-view="statistics" class="rail-item" title="Statistiques"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V4"/></svg></span></a>
            </div>
            <div class="rail-bottom">
                <button id="add-reservation-btn" class="rail-add" title="Nouvelle réservation"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
            </div>
        </nav>

        <!-- Zone de travail -->
        <div class="workarea">
            <!-- App bar (niveau 1) -->
            <div class="app-bar">
                <div class="app-bar-left">
                    <div class="brand-lockup"><span class="app-name">Au Murmure des Flots</span></div>
                </div>
                <div class="app-bar-right">
                    <span id="current-date" class="app-meta"></span>
                    <span id="current-time" class="app-meta app-time"></span>
                    <span id="connection-status" class="status-badge disconnected">Déconnecté</span>
                </div>
            </div>

            <!-- View bar (niveau 2) -->
            <div class="view-bar">
                <h2 id="reservations-title" class="view-title">Aujourd'hui</h2>
                <div class="view-bar-actions">
                    <div class="filters">
                        <input type="date" id="date-filter" aria-label="Date du planning" class="filter-input">
                        <select id="service-filter" aria-label="Filtrer par service" class="filter-input">
                            <option value="all">Tous services</option>
                            <option value="midi">Midi</option>
                            <option value="soir">Soir</option>
                        </select>
                        <select id="status-filter" aria-label="Filtrer par statut" class="filter-input">
                            <option value="all">Tous statuts</option>
                            <option value="pending">En attente</option>
                            <option value="confirmed">Confirmées</option>
                            <option value="cancelled">Annulées</option>
                        </select>
                        <input type="text" id="search-input" aria-label="Rechercher une réservation" class="filter-input filter-search" placeholder="Rechercher...">
                    </div>
                    <button id="show-qr-btn" class="btn-tool" title="Accès tablette" aria-label="Accès tablette"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M10 18h4"/></svg></button>
                </div>
            </div>

            <!-- Zone de contenu scrollable -->
            <div class="content-area">
                <div id="floor-plan-section" data-floor-plan class="view-section hidden"></div>
                <div class="reservations-grid" id="reservations-container"></div>

                <div id="clients-section" class="view-section hidden">
                    <div class="clients-toolbar">
                        <input type="text" id="client-search" class="filter-input filter-search" placeholder="Rechercher un client...">
                        <button id="export-clients-btn" class="btn-tool">Exporter CSV</button>
                    </div>
                    <div id="clients-container"></div>
                </div>

                <div id="week-section" class="view-section hidden">
                    <div id="week-container"></div>
                </div>

                <div id="pending-section" class="view-section hidden">
                    <div id="pending-container"></div>
                </div>

                <div id="month-section" class="view-section hidden">
                    <div id="month-container"></div>
                </div>

                <div id="service-detail-section" class="view-section hidden">
                    <div id="service-detail-container"></div>
                </div>

                <div id="statistics-section" class="view-section hidden">
                    <div id="statistics-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal nouvelle réservation -->
    <div id="new-reservation-modal" class="modal">
        <div class="modal-surface modal-narrow">
            <div class="modal-header">
                <h2 id="new-reservation-title">Nouvelle Réservation</h2>
                <button class="close-new-modal modal-close">&times;</button>
            </div>
            <form id="new-reservation-form" class="modal-body">
                <div class="form-group">
                    <label for="new-name">Nom complet</label>
                    <input type="text" id="new-name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-date">Date</label>
                        <input type="date" id="new-date" required>
                    </div>
                    <div class="form-group">
                        <label for="new-time">Heure</label>
                        <select id="new-time" required>
                            <option value="">Choisir</option>
                            <optgroup label="Midi">
                                <option value="12:00">12:00</option>
                                <option value="12:15">12:15</option>
                                <option value="12:30">12:30</option>
                                <option value="12:45">12:45</option>
                                <option value="13:00">13:00</option>
                                <option value="13:15">13:15</option>
                            </optgroup>
                            <optgroup label="Soir">
                                <option value="18:30">18:30</option>
                                <option value="18:45">18:45</option>
                                <option value="19:00">19:00</option>
                                <option value="19:15">19:15</option>
                                <option value="19:30">19:30</option>
                                <option value="19:45">19:45</option>
                                <option value="20:00">20:00</option>
                                <option value="20:15">20:15</option>
                                <option value="20:30">20:30</option>
                                <option value="20:45">20:45</option>
                                <option value="21:00">21:00</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-people">Personnes</label>
                        <input type="number" id="new-people" min="1" value="2" required placeholder="Nombre de personnes">
                    </div>
                    <div class="form-group">
                        <label for="new-phone">Téléphone</label>
                        <input type="tel" id="new-phone" required placeholder="0692123456">
                    </div>
                </div>
                <div class="form-group">
                    <label for="new-email">Email</label>
                    <input type="email" id="new-email" placeholder="client@email.com">
                </div>
                <div class="form-group">
                    <label for="new-requests">Demandes spéciales</label>
                    <textarea id="new-requests" rows="2" placeholder="Allergies, préférences..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-new-btn">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="submit-reservation-btn">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal détails réservation -->
    <div id="reservation-modal" class="modal">
        <div class="modal-surface modal-narrow">
            <div class="modal-header">
                <h2>Détails</h2>
                <div class="modal-header-actions">
                    <button type="button" id="edit-btn" class="btn btn-primary">Modifier</button>
                    <button type="button" class="close modal-close" aria-label="Fermer la fiche">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <div id="reservation-details"></div>
                <div class="modal-actions">
                    <button id="confirm-btn" class="btn btn-success">Confirmer</button>
                    <button id="cancel-btn" class="btn btn-danger">Annuler</button>
                    <button id="completed-btn" class="btn btn-secondary" disabled data-unavailable style="display:none" title="Suivi d arrivee indisponible dans cette version">Client installé</button>
                    <button id="noshow-btn" class="btn btn-warning" style="display:none">No-show</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal QR Code -->
    <div id="qr-modal" class="modal">
        <div class="modal-surface modal-narrow">
            <div class="modal-header">
                <h2>Accès Tablette</h2>
                <button class="close-qr-modal modal-close">&times;</button>
            </div>
            <div class="modal-body modal-center">
                <p class="text-muted">Scannez pour accéder au tableau de bord</p>
                <div class="qr-container">
                    <img id="qr-code-img" src="" alt="QR Code">
                </div>
                <p class="text-xs text-muted" id="admin-url-display"></p>
                <button id="copy-url-btn" class="btn btn-secondary" style="margin-top: 12px;">Copier l'URL</button>
            </div>
        </div>
    </div>

    <script src="release-controls.js"></script>
    <script src="service-ui.js"></script>
    <script src="reservation-changes.js"></script>
    <script src="service-rhythm.js"></script>
    <script src="floor-plan.js"></script>
    <script type="module" src="renderer.js"></script>
</body>
</html>
