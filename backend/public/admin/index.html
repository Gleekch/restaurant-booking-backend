<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1c1917">
    <title>Au Murmure des Flots - Gestion</title>
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="service-ui.css">
    <link rel="stylesheet" href="staff-tools.css">
</head>
<body>
    <div class="shell">

        <!-- Rail gauche — navigation icônes -->
        <nav class="rail" aria-label="Navigation principale">
            <img class="rail-logo" src="assets/brand-spiral.svg" alt="Au Murmure des Flots" width="52" height="52">
            <a href="#" class="rail-item active" data-view="today" title="Aujourd'hui">
                <span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h2v2H9z"/></svg></span>
            </a>
            <a href="#" class="rail-item" data-view="pending" title="À confirmer">
                <span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span>
                <span class="badge" id="pending-badge" style="display: none;">0</span>
            </a>
            <a href="#" class="rail-item" data-view="week" title="Semaine">
                <span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 11h18m-12 0v10m6-10v10"/></svg></span>
            </a>
            <a href="#" class="rail-item" data-view="month" title="Mois">
                <span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 11h18m-12 0v10m6-10v10M3 16h18"/></svg></span>
            </a>
            <a href="#" class="rail-item" data-view="floor-plan" title="Plan de salle"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="15" width="18" height="6" rx="1"/></svg></span></a>
            <a href="#" class="rail-item" data-view="clients" title="Clients"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v3"/></svg></span></a>
            <a href="#" class="rail-item" data-view="statistics" title="Statistiques"><span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 3v18h17M8 17v-5m5 5V7m5 10V4"/></svg></span></a>
            <div class="rail-spacer"></div>
            <a href="#" class="rail-item rail-add" data-view="new" title="Nouvelle réservation">
                <span class="rail-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
            </a>
        </nav>

        <!-- Zone de travail -->
        <div class="workarea">

            <!-- Barre supérieure -->
            <div class="app-bar">
                <div class="brand-lockup"><span class="app-bar-title">Au Murmure des Flots</span></div>
                <div class="connection-status" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Connexion...</span>
                    <button type="button" id="reconnect-button" class="reconnect-button" hidden>Recharger</button>
                </div>
            </div>

            <!-- Contenu principal -->
            <main id="main-content">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Chargement des réservations...</p>
                </div>
                <div id="content"></div>
            </main>

        </div>
    </div>

    <!-- Modal détails réservation -->
    <div id="reservation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Détails</h2>
                <div class="modal-header-actions">
                    <button type="button" id="edit-reservation-btn" class="btn btn-primary" hidden>Modifier</button>
                    <button type="button" class="close-btn" onclick="closeModal()" aria-label="Fermer la fiche">&times;</button>
                </div>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <!-- Modal nouvelle réservation -->
    <div id="new-reservation-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nouvelle Réservation</h2>
                <button class="close-btn" onclick="closeNewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="new-reservation-form">
                    <div class="form-group">
                        <label for="customerName">Nom du client *</label>
                        <input type="text" id="customerName" required>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Téléphone *</label>
                        <input type="tel" id="phoneNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date *</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="time">Heure *</label>
                            <input type="time" id="time" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="numberOfPeople">Nombre de personnes *</label>
                        <input type="number" id="numberOfPeople" min="1" value="2" required>
                    </div>
                    <div class="form-group">
                        <label for="specialRequests">Notes / Demandes spéciales</label>
                        <textarea id="specialRequests" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Créer la réservation</button>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="release-controls.js"></script>
    <script src="service-ui.js"></script>
    <script src="staff-insights.js"></script>
    <script src="floor-plan.js"></script>
    <script src="reservation-changes.js"></script>
    <script src="service-rhythm.js"></script>
    <script src="app.js"></script>
</body>
</html>
